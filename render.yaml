# Blueprint do Render: cria o backend (web service) e o frontend (static site).
# Em Render → New → Blueprint, aponte para este repositório.
services:
  # ── Backend (API Express) ────────────────────────────────────────────
  - type: web
    name: withub-api
    runtime: node
    rootDir: server
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY # nunca vai para o frontend
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: ALLOWED_ORIGINS # URL do frontend, ex.: https://withub-web.onrender.com
        sync: false

  # ── Frontend (React/Vite estático, servido pela CDN do Render) ───────
  - type: web
    name: withub-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_API_URL # URL do backend, ex.: https://withub-api.onrender.com
        sync: false
    routes:
      - type: rewrite # SPA: react-router cuida das rotas
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
